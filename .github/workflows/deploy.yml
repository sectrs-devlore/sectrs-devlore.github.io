name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: make build

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin website
          git worktree add website origin/website
          cd website
          git rm -rq .
          cp -r ../dist/. .
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}" || exit 0
          git push origin HEAD:website
